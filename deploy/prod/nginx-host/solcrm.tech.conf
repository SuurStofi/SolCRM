# Host nginx site for https://solcrm.tech -> SolCRM on 127.0.0.1:8137.
#
# Install:
#   sudo cp deploy/prod/nginx-host/solcrm.tech.conf /etc/nginx/sites-available/solcrm.tech
#   sudo ln -s /etc/nginx/sites-available/solcrm.tech /etc/nginx/sites-enabled/solcrm.tech
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: get a real certificate before serving this publicly --
#   sudo certbot --nginx -d solcrm.tech -d www.solcrm.tech
# certbot rewrites the ssl_certificate lines below to its own paths. Until it
# runs, the self-signed fallback only stops nginx failing to start; browsers
# will warn, and this app handles money, so do not use it in anger.
#
# Unlike the other sites on this box, there is no $is_cloudflare gate here:
# this origin is reachable directly, by request.

server {
    listen 80;
    listen [::]:80;
    server_name solcrm.tech www.solcrm.tech;

    # Leave this reachable over plain HTTP so certbot can renew.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://solcrm.tech$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.solcrm.tech;

    ssl_certificate     /etc/nginx/ssl/solcrm.tech.crt;
    ssl_certificate_key /etc/nginx/ssl/solcrm.tech.key;

    return 301 https://solcrm.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name solcrm.tech;

    ssl_certificate     /etc/nginx/ssl/solcrm.tech.crt;
    ssl_certificate_key /etc/nginx/ssl/solcrm.tech.key;

    access_log /var/log/nginx/solcrm.access.log;
    error_log  /var/log/nginx/solcrm.error.log warn;

    client_max_body_size 2m;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # The app holds an encryption key and live trading sessions, so it is
    # served over HTTPS only and never framed by another origin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8137;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # No Cloudflare in front, so the real client address comes from the
        # connection itself rather than CF-Connecting-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
